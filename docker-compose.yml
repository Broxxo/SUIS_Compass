# 本地开发用 PostgreSQL（与 apps/api/.env 中 DATABASE_URL 一致）
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: suis
      POSTGRES_PASSWORD: suis
      POSTGRES_DB: suis_compass
    ports:
      - '5432:5432'
    volumes:
      - suis_compass_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U suis -d suis_compass']
      interval: 3s
      timeout: 5s
      retries: 15

volumes:
  suis_compass_pgdata:
